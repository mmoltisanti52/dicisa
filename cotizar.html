  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --teal: #1BB8C5; --teal-l: #5dd6e0;
      --ink: #0d1117; --ink-2: #1a2230; --white: #ffffff; --smoke: #8fa0b0;
      --radius: 4px;
      --ff-head: 'Bebas Neue', sans-serif;
      --ff-body: 'DM Sans', sans-serif;
    }
    body { font-family: var(--ff-body); background: var(--ink); color: var(--white); line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }

    nav {
      position: sticky; top: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 clamp(1.5rem,5vw,4rem); height: 64px;
      background: rgba(13,17,23,0.92); backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(27,184,197,0.15);
    }
    .nav-logo img { height: 38px; width: auto; display: block; mix-blend-mode: screen; }
    .nav-back { text-decoration: none; color: var(--smoke); font-size: 0.8rem; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; transition: color 0.2s; }
    .nav-back:hover { color: var(--teal); }

    header { padding: 2.5rem clamp(1.5rem,5vw,4rem) 1.5rem; max-width: 1100px; width: 100%; margin: 0 auto; }
    header h1 { font-family: var(--ff-head); font-size: clamp(2.4rem,6vw,3.6rem); letter-spacing: 1px; line-height: 1; }
    header h1 span { color: var(--teal); }
    header p { color: var(--smoke); margin-top: 0.6rem; max-width: 640px; }

    main { flex: 1; padding: 0 clamp(1rem,4vw,4rem) 2.5rem; max-width: 1100px; width: 100%; margin: 0 auto; }
    .frame-wrap { background: var(--white); border: 1px solid rgba(27,184,197,0.25); border-radius: var(--radius); overflow: hidden; }
    .frame-wrap iframe { display: block; width: 100%; height: 80vh; min-height: 640px; border: 0; }
    .fallback { margin-top: 1rem; font-size: 0.85rem; color: var(--smoke); }
    .fallback a { color: var(--teal); }

    footer { text-align: center; padding: 1.5rem; font-size: 0.75rem; color: var(--smoke); border-top: 1px solid rgba(27,184,197,0.1); }
  </style>
</head>

<nav>

</main>

<footer>&copy; DICISA — Diseño Civil Sustentable · Hermosillo y Guaymas, Sonora</footer>
